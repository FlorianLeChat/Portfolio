stages:
    - lint
    - test
    - build
    - analyze
    - deploy

default:
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - .npm
        policy: pull-push

lint:eslint:
    stage: lint
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - npm run lint
    artifacts:
        when: always
        reports:
            codequality: gl-codequality.json
        expire_in: 1 hour

test:e2e:
    image: node:22@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
    stage: test
    timeout: 15 minutes
    before_script:
        - npm ci --cache .npm --prefer-offline
        - npm run build
        - npx playwright install --with-deps
    script:
        - npm run test
    artifacts:
        when: always
        paths:
            - test-results/
        access: developer
        reports:
            junit: playwright-report.xml
        expire_in: 1 hour
    dependencies: []

build:node:
    stage: build
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - mv $ENV_FILE .env
        - echo "" >> .env
        - echo "PUBLIC_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" >> .env
        - npm run build
    artifacts:
        paths:
            - build/
        expire_in: 1 hour
    dependencies: []

analyze:sast:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/semgrep
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:iac:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/kics
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:secret-detection:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/secrets
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-secret-detection-report.json
        reports:
            secret_detection: gl-secret-detection-report.json
        expire_in: 1 hour
    dependencies: []

deploy:pages:
    stage: deploy
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH
          when: manual
    pages:
        publish: build
    before_script: []
    script:
        - echo 'Deploy to GitLab Pages'
    artifacts:
        expire_in: 1 hour
    dependencies:
        - build:node
    allow_failure: false
